<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" role="img" aria-label="Diagram: five Python scripts fetch and grid the map once; build.py puts it and the JavaScript modules into one index.html; every frame the clock, weather, fire and crews step and the scene is drawn" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13">
<rect width="780" height="560" rx="10" fill="#f5f5f1"/>
<text x="20" y="30" fill="#2a8fa3" font-weight="600">Once, before the build: Python, standard library only</text><rect x="20" y="46" width="170" height="44" rx="7" fill="#fff" stroke="#2a8fa3" stroke-width="1.4"/><text x="105" y="65" fill="#0b0f14" text-anchor="middle" font-weight="600">fetch_osm.py</text><text x="105" y="81" fill="#6b7078" text-anchor="middle" font-size="11.5">forest from OpenStreetMap</text><line x1="190" y1="68" x2="222" y2="68" stroke="#6b7078" stroke-width="1.4"/><path d="M222 68L215.7 71L215.7 65Z" fill="#6b7078"/><rect x="222" y="46" width="150" height="44" rx="7" fill="#fff" stroke="#2a8fa3" stroke-width="1.4"/><text x="297" y="65" fill="#0b0f14" text-anchor="middle" font-weight="600">rasterise.py</text><text x="297" y="81" fill="#6b7078" text-anchor="middle" font-size="11.5">cells of 25 m</text><line x1="372" y1="68" x2="420" y2="150" stroke="#b8bcc2" stroke-width="1.4"/><path d="M420 150L414.2 146.1L419.4 143Z" fill="#b8bcc2"/><rect x="20" y="102" width="170" height="44" rx="7" fill="#fff" stroke="#2a8fa3" stroke-width="1.4"/><text x="105" y="121" fill="#0b0f14" text-anchor="middle" font-weight="600">fetch_city.py</text><text x="105" y="137" fill="#6b7078" text-anchor="middle" font-size="11.5">city around it</text><line x1="190" y1="124" x2="420" y2="150" stroke="#b8bcc2" stroke-width="1.4"/><path d="M420 150L413.4 152.3L414.1 146.3Z" fill="#b8bcc2"/><rect x="20" y="158" width="170" height="44" rx="7" fill="#fff" stroke="#2a8fa3" stroke-width="1.4"/><text x="105" y="177" fill="#0b0f14" text-anchor="middle" font-weight="600">fetch_stations.py</text><text x="105" y="193" fill="#6b7078" text-anchor="middle" font-size="11.5">fire stations</text><line x1="190" y1="180" x2="420" y2="150" stroke="#b8bcc2" stroke-width="1.4"/><path d="M420 150L414.1 153.8L413.4 147.8Z" fill="#b8bcc2"/><rect x="20" y="214" width="170" height="44" rx="7" fill="#fff" stroke="#2a8fa3" stroke-width="1.4"/><text x="105" y="233" fill="#0b0f14" text-anchor="middle" font-weight="600">fetch_germany.py</text><text x="105" y="249" fill="#6b7078" text-anchor="middle" font-size="11.5">outline for the locator</text><line x1="190" y1="236" x2="420" y2="150" stroke="#b8bcc2" stroke-width="1.4"/><path d="M420 150L415.2 155.1L413 149.4Z" fill="#b8bcc2"/><rect x="420" y="126" width="140" height="48" rx="7" fill="#fff" stroke="#2a8fa3" stroke-width="1.4"/><text x="490" y="147" fill="#0b0f14" text-anchor="middle" font-weight="600">build.py</text><text x="490" y="163" fill="#6b7078" text-anchor="middle" font-size="11.5">inlines it all</text><line x1="560" y1="150" x2="600" y2="150" stroke="#6b7078" stroke-width="1.4"/><path d="M600 150L593.7 153L593.7 147Z" fill="#6b7078"/><rect x="600" y="120" width="160" height="60" rx="7" fill="#fff4ee" stroke="#c8431f" stroke-width="1.4"/><text x="680" y="147" fill="#0b0f14" text-anchor="middle" font-weight="600">index.html</text><text x="680" y="163" fill="#6b7078" text-anchor="middle" font-size="11.5">one file, ~177 KB</text><text x="20" y="296" fill="#c8431f" font-weight="600">Inside index.html: JavaScript modules, no library</text><rect x="20" y="310" width="138" height="44" rx="7" fill="#fff" stroke="#c8431f" stroke-width="1.4"/><text x="89" y="329" fill="#0b0f14" text-anchor="middle" font-weight="600">grid.js</text><text x="89" y="345" fill="#6b7078" text-anchor="middle" font-size="11.5">map, cell kinds</text><rect x="170" y="310" width="138" height="44" rx="7" fill="#fff" stroke="#c8431f" stroke-width="1.4"/><text x="239" y="329" fill="#0b0f14" text-anchor="middle" font-weight="600">fire.js</text><text x="239" y="345" fill="#6b7078" text-anchor="middle" font-size="11.5">the automaton</text><rect x="320" y="310" width="138" height="44" rx="7" fill="#fff" stroke="#c8431f" stroke-width="1.4"/><text x="389" y="329" fill="#0b0f14" text-anchor="middle" font-weight="600">weather.js</text><text x="389" y="345" fill="#6b7078" text-anchor="middle" font-size="11.5">days, clouds, rain</text><rect x="470" y="310" width="138" height="44" rx="7" fill="#fff" stroke="#c8431f" stroke-width="1.4"/><text x="539" y="329" fill="#0b0f14" text-anchor="middle" font-weight="600">crews.js</text><text x="539" y="345" fill="#6b7078" text-anchor="middle" font-size="11.5">stations, roads</text><rect x="620" y="310" width="138" height="44" rx="7" fill="#fff" stroke="#c8431f" stroke-width="1.4"/><text x="689" y="329" fill="#0b0f14" text-anchor="middle" font-weight="600">storm.js</text><text x="689" y="345" fill="#6b7078" text-anchor="middle" font-size="11.5">300 strikes</text><rect x="20" y="366" width="138" height="44" rx="7" fill="#fff" stroke="#c8431f" stroke-width="1.4"/><text x="89" y="385" fill="#0b0f14" text-anchor="middle" font-weight="600">charts.js</text><text x="89" y="401" fill="#6b7078" text-anchor="middle" font-size="11.5">three charts</text><rect x="170" y="366" width="138" height="44" rx="7" fill="#fff" stroke="#c8431f" stroke-width="1.4"/><text x="239" y="385" fill="#0b0f14" text-anchor="middle" font-weight="600">scene.js</text><text x="239" y="401" fill="#6b7078" text-anchor="middle" font-size="11.5">WebGL2 view</text><rect x="320" y="366" width="138" height="44" rx="7" fill="#fff" stroke="#c8431f" stroke-width="1.4"/><text x="389" y="385" fill="#0b0f14" text-anchor="middle" font-weight="600">shaders.js</text><text x="389" y="401" fill="#6b7078" text-anchor="middle" font-size="11.5">GPU programs</text><rect x="470" y="366" width="138" height="44" rx="7" fill="#fff" stroke="#c8431f" stroke-width="1.4"/><text x="539" y="385" fill="#0b0f14" text-anchor="middle" font-weight="600">main.js</text><text x="539" y="401" fill="#6b7078" text-anchor="middle" font-size="11.5">page, clock, touch</text><text x="620" y="392" fill="#6b7078" font-size="11.5">+ gl.js, math.js, locator.js</text><text x="20" y="452" fill="#0b0f14" font-weight="600">Every frame</text><rect x="20" y="466" width="108" height="40" rx="7" fill="#fff" stroke="#0b0f14" stroke-width="1.4"/><text x="74" y="490.5" fill="#0b0f14" text-anchor="middle" font-weight="600">clock</text><rect x="146" y="466" width="108" height="40" rx="7" fill="#fff" stroke="#0b0f14" stroke-width="1.4"/><text x="200" y="490.5" fill="#0b0f14" text-anchor="middle" font-weight="600">sky.step</text><line x1="128" y1="486" x2="146" y2="486" stroke="#6b7078" stroke-width="1.4"/><path d="M146 486L139.7 489L139.7 483Z" fill="#6b7078"/><rect x="272" y="466" width="108" height="40" rx="7" fill="#fff" stroke="#0b0f14" stroke-width="1.4"/><text x="326" y="490.5" fill="#0b0f14" text-anchor="middle" font-weight="600">live.step</text><line x1="254" y1="486" x2="272" y2="486" stroke="#6b7078" stroke-width="1.4"/><path d="M272 486L265.7 489L265.7 483Z" fill="#6b7078"/><rect x="398" y="466" width="108" height="40" rx="7" fill="#fff" stroke="#0b0f14" stroke-width="1.4"/><text x="452" y="490.5" fill="#0b0f14" text-anchor="middle" font-weight="600">crews.step</text><line x1="380" y1="486" x2="398" y2="486" stroke="#6b7078" stroke-width="1.4"/><path d="M398 486L391.7 489L391.7 483Z" fill="#6b7078"/><rect x="524" y="466" width="108" height="40" rx="7" fill="#fff" stroke="#0b0f14" stroke-width="1.4"/><text x="578" y="490.5" fill="#0b0f14" text-anchor="middle" font-weight="600">scene.draw</text><line x1="506" y1="486" x2="524" y2="486" stroke="#6b7078" stroke-width="1.4"/><path d="M524 486L517.7 489L517.7 483Z" fill="#6b7078"/><rect x="650" y="466" width="108" height="40" rx="7" fill="#fff" stroke="#0b0f14" stroke-width="1.4"/><text x="704" y="490.5" fill="#0b0f14" text-anchor="middle" font-weight="600">labels, charts</text><line x1="632" y1="486" x2="650" y2="486" stroke="#6b7078" stroke-width="1.4"/><path d="M650 486L643.7 489L643.7 483Z" fill="#6b7078"/><text x="20" y="532" fill="#6b7078" font-size="11.5">The steps in the middle run 4 times a second at 1×; drawing runs every frame.</text>
</svg>
