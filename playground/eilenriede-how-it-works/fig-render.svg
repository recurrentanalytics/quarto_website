<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img" aria-label="Diagram of one frame: the scene is drawn off screen with multisampling, resolved, its bright parts blurred at a quarter size and mixed back in" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13">
<rect width="780" height="300" rx="10" fill="#f5f5f1"/>
<rect x="20" y="40" width="132" height="54" rx="7" fill="#fff" stroke="#c8431f" stroke-width="1.4"/><text x="86" y="64" fill="#0b0f14" text-anchor="middle" font-weight="600">draw the scene</text><text x="86" y="80" fill="#6b7078" text-anchor="middle" font-size="11.5">ground, trees, points</text><rect x="172" y="40" width="132" height="54" rx="7" fill="#fff" stroke="#0b0f14" stroke-width="1.4"/><text x="238" y="64" fill="#0b0f14" text-anchor="middle" font-weight="600">resolve</text><text x="238" y="80" fill="#6b7078" text-anchor="middle" font-size="11.5">4× multisampling</text><line x1="152" y1="67" x2="172" y2="67" stroke="#6b7078" stroke-width="1.4"/><path d="M172 67L165.7 70L165.7 64Z" fill="#6b7078"/><rect x="324" y="40" width="132" height="54" rx="7" fill="#fff" stroke="#0b0f14" stroke-width="1.4"/><text x="390" y="64" fill="#0b0f14" text-anchor="middle" font-weight="600">bright parts</text><text x="390" y="80" fill="#6b7078" text-anchor="middle" font-size="11.5">¼ size</text><line x1="304" y1="67" x2="324" y2="67" stroke="#6b7078" stroke-width="1.4"/><path d="M324 67L317.7 70L317.7 64Z" fill="#6b7078"/><rect x="476" y="40" width="132" height="54" rx="7" fill="#fff" stroke="#0b0f14" stroke-width="1.4"/><text x="542" y="64" fill="#0b0f14" text-anchor="middle" font-weight="600">blur</text><text x="542" y="80" fill="#6b7078" text-anchor="middle" font-size="11.5">2 × across, down</text><line x1="456" y1="67" x2="476" y2="67" stroke="#6b7078" stroke-width="1.4"/><path d="M476 67L469.7 70L469.7 64Z" fill="#6b7078"/><rect x="628" y="40" width="132" height="54" rx="7" fill="#fff" stroke="#0b0f14" stroke-width="1.4"/><text x="694" y="64" fill="#0b0f14" text-anchor="middle" font-weight="600">mix</text><text x="694" y="80" fill="#6b7078" text-anchor="middle" font-size="11.5">glow, colour, corners</text><line x1="608" y1="67" x2="628" y2="67" stroke="#6b7078" stroke-width="1.4"/><path d="M628 67L621.7 70L621.7 64Z" fill="#6b7078"/><line x1="694" y1="94" x2="694" y2="130" stroke="#6b7078" stroke-width="1.4"/><path d="M694 130L691 123.7L697 123.7Z" fill="#6b7078"/><rect x="628" y="130" width="132" height="44" rx="7" fill="#fff" stroke="#0b0f14" stroke-width="1.4"/><text x="694" y="156.5" fill="#0b0f14" text-anchor="middle" font-weight="600">screen</text><text x="20" y="136" fill="#0b0f14" font-weight="600">The scene reads three textures:</text><circle cx="28" cy="158" r="4" fill="#c8431f"/><text x="40" y="162" fill="#0b0f14" ><tspan font-weight="600">cell states</tspan>  <tspan fill="#6b7078">kind, state, age; nearest cell</tspan></text><circle cx="28" cy="182" r="4" fill="#c8431f"/><text x="40" y="186" fill="#0b0f14" ><tspan font-weight="600">city</tspan>  <tspan fill="#6b7078">buildings, streets, water, forest; filtered</tspan></text><circle cx="28" cy="206" r="4" fill="#c8431f"/><text x="40" y="210" fill="#0b0f14" ><tspan font-weight="600">heat</tspan>  <tspan fill="#6b7078">where fire burns, blurred; for light</tspan></text><text x="20" y="250" fill="#6b7078" font-size="12">Labels and names are drawn on a second, plain 2D canvas on top.</text><text x="20" y="270" fill="#6b7078" font-size="12">The state texture is sent again only when cells change: 4 times a second at 1×, or at a touch.</text>
</svg>
