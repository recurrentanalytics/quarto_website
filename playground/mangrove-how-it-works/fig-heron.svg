<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="The three states of the heron: stand, strike and walk, and what moves it from one to the next" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13">
<rect width="760" height="250" rx="10" fill="#f5f5f1"/>
<rect x="70" y="96" width="150" height="56" rx="8" fill="#fff" stroke="#0b0f14" stroke-width="1.4"/><text x="145" y="121" fill="#0b0f14" text-anchor="middle" font-weight="600" font-size="14">stand</text><text x="145" y="139" text-anchor="middle" fill="#6b7078">waits, watches</text><rect x="540" y="24" width="150" height="56" rx="8" fill="#fff" stroke="#0b0f14" stroke-width="1.4"/><text x="615" y="49" fill="#0b0f14" text-anchor="middle" font-weight="600" font-size="14">strike</text><text x="615" y="67" text-anchor="middle" fill="#6b7078">0.6 seconds</text><rect x="540" y="168" width="150" height="56" rx="8" fill="#fff" stroke="#0b0f14" stroke-width="1.4"/><text x="615" y="193" fill="#0b0f14" text-anchor="middle" font-weight="600" font-size="14">walk</text><text x="615" y="211" text-anchor="middle" fill="#6b7078">to shallow water</text><path d="M220 108L538 42" fill="none" stroke="#0b0f14" stroke-width="1.6"  stroke-linejoin="round"/><path d="M538 42 L530.6 47.1 L529.2 40.3 Z" fill="#0b0f14"/><text x="360" y="52" fill="#0b0f14" text-anchor="middle">a fish comes close in front</text><path d="M538 62L222 126" fill="none" stroke="#6b7078" stroke-width="1.6"  stroke-linejoin="round"/><path d="M222 126 L229.4 120.9 L230.8 127.8 Z" fill="#6b7078"/><text x="400" y="106" fill="#6b7078" text-anchor="middle">done</text><path d="M220 140L538 206" fill="none" stroke="#0b0f14" stroke-width="1.6"  stroke-linejoin="round"/><path d="M538 206 L529.2 207.7 L530.6 200.9 Z" fill="#0b0f14"/><text x="522" y="240" fill="#0b0f14" text-anchor="end">waited long enough, or the water got too deep or left</text><path d="M538 186L222 132" fill="none" stroke="#6b7078" stroke-width="1.6"  stroke-linejoin="round"/><path d="M222 132 L230.8 129.9 L229.6 136.9 Z" fill="#6b7078"/><text x="420" y="150" fill="#6b7078" text-anchor="middle">arrived, or 12 s passed</text>
</svg>
