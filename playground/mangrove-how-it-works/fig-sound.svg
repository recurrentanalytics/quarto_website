<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="How the sound is wired: a slow chord through a low-pass filter, bells through an echo, filtered noise for water and weather, a shared room echo, then master volume, compressor and speaker" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13">
