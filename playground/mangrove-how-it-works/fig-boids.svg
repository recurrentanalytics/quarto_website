<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="The three rules of a fish in the school: keep space, match the heading, stay near" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13">
<rect width="760" height="250" rx="10" fill="#f5f5f1"/>
<g transform="translate(10 0)"><text x="120" y="34" fill="#0b0f14" text-anchor="middle" font-weight="600" font-size="15">Keep a little space</text><g transform="translate(105 130) rotate(-10) scale(1.5)"><path d="M-11 0 L5 -5 L12 0 L5 5 Z M-11 0 L-17 -5 L-17 5 Z" fill="#0b0f14"/></g><g transform="translate(138 118) rotate(-20) scale(1.5)"><path d="M-11 0 L5 -5 L12 0 L5 5 Z M-11 0 L-17 -5 L-17 5 Z" fill="#6b7078"/></g><line x1="100" y1="134" x2="62" y2="152" stroke="#d9920f" stroke-width="2.5"/><path d="M62 152 L67.6 145 L71 152.1 Z" fill="#d9920f"/><text x="120" y="228" text-anchor="middle" fill="#6b7078">away from one that is too close</text></g><g transform="translate(260 0)"><text x="120" y="34" fill="#0b0f14" text-anchor="middle" font-weight="600" font-size="15">Swim the way they swim</text><g transform="translate(120 135) rotate(25) scale(1.5)"><path d="M-11 0 L5 -5 L12 0 L5 5 Z M-11 0 L-17 -5 L-17 5 Z" fill="#0b0f14"/></g><g transform="translate(75 100) rotate(-20) scale(1.5)"><path d="M-11 0 L5 -5 L12 0 L5 5 Z M-11 0 L-17 -5 L-17 5 Z" fill="#6b7078"/></g><g transform="translate(165 95) rotate(-25) scale(1.5)"><path d="M-11 0 L5 -5 L12 0 L5 5 Z M-11 0 L-17 -5 L-17 5 Z" fill="#6b7078"/></g><g transform="translate(160 160) rotate(-15) scale(1.5)"><path d="M-11 0 L5 -5 L12 0 L5 5 Z M-11 0 L-17 -5 L-17 5 Z" fill="#6b7078"/></g><line x1="126" y1="138" x2="166" y2="122" stroke="#d9920f" stroke-width="2.5"/><path d="M166 122 L159.9 128.6 L157 121.4 Z" fill="#d9920f"/><text x="120" y="228" text-anchor="middle" fill="#6b7078">turn to the neighbours’ heading</text></g><g transform="translate(510 0)"><text x="120" y="34" fill="#0b0f14" text-anchor="middle" font-weight="600" font-size="15">Stay near the others</text><g transform="translate(60 150) rotate(0) scale(1.5)"><path d="M-11 0 L5 -5 L12 0 L5 5 Z M-11 0 L-17 -5 L-17 5 Z" fill="#0b0f14"/></g><g transform="translate(150 95) rotate(-10) scale(1.5)"><path d="M-11 0 L5 -5 L12 0 L5 5 Z M-11 0 L-17 -5 L-17 5 Z" fill="#6b7078"/></g><g transform="translate(180 130) rotate(-5) scale(1.5)"><path d="M-11 0 L5 -5 L12 0 L5 5 Z M-11 0 L-17 -5 L-17 5 Z" fill="#6b7078"/></g><g transform="translate(150 160) rotate(5) scale(1.5)"><path d="M-11 0 L5 -5 L12 0 L5 5 Z M-11 0 L-17 -5 L-17 5 Z" fill="#6b7078"/></g><circle cx="160" cy="128" r="4" fill="#d9920f"/><line x1="70" y1="147" x2="150" y2="130" stroke="#d9920f" stroke-width="2.5"/><path d="M150 130 L142.9 135.5 L141.3 127.9 Z" fill="#d9920f"/><text x="120" y="228" text-anchor="middle" fill="#6b7078">toward the middle of the neighbours</text></g>
</svg>
