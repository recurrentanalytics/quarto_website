<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="The chain behind the Maria page: grid, storm, fragility, power flow and outcome in the LiveLines kernel; the outcome at the last hour is compared with night lights and outage reports" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13">
<rect width="760" height="430" rx="10" fill="#f5f5f1"/>
<text x="24" y="30" fill="#6b7078" font-weight="600">In the LiveLines kernel, one run</text><rect x="24" y="44" width="200" height="82" rx="8" fill="#fff" stroke="#0b0f14" stroke-width="1.4"/><text x="124" y="68" fill="#0b0f14" text-anchor="middle" font-weight="600" font-size="14">grid</text><text x="124" y="87" fill="#6b7078" text-anchor="middle">56 substations, 92 branches</text><text x="124" y="103" fill="#6b7078" text-anchor="middle">OSM via PyPSA-Earth</text><rect x="280" y="44" width="200" height="82" rx="8" fill="#fff" stroke="#0b0f14" stroke-width="1.4"/><text x="380" y="68" fill="#0b0f14" text-anchor="middle" font-weight="600" font-size="14">storm</text><text x="380" y="87" fill="#6b7078" text-anchor="middle">IBTrACS track →</text><text x="380" y="103" fill="#6b7078" text-anchor="middle">gust at points on the lines</text><rect x="536" y="44" width="200" height="82" rx="8" fill="#fff" stroke="#0b0f14" stroke-width="1.4"/><text x="636" y="68" fill="#0b0f14" text-anchor="middle" font-weight="600" font-size="14">fragility</text><text x="636" y="87" fill="#6b7078" text-anchor="middle">the hour each line breaks,</text><text x="636" y="103" fill="#6b7078" text-anchor="middle">8 runs, seed 42</text><rect x="536" y="170" width="200" height="82" rx="8" fill="#fff" stroke="#0b0f14" stroke-width="1.4"/><text x="636" y="194" fill="#0b0f14" text-anchor="middle" font-weight="600" font-size="14">power flow</text><text x="636" y="213" fill="#6b7078" text-anchor="middle">DC flow with overload trips;</text><text x="636" y="229" fill="#6b7078" text-anchor="middle">PyPSA: an ideal operator</text><rect x="280" y="170" width="200" height="82" rx="8" fill="#fff" stroke="#0b0f14" stroke-width="1.4"/><text x="380" y="194" fill="#0b0f14" text-anchor="middle" font-weight="600" font-size="14">outcome</text><text x="380" y="213" fill="#6b7078" text-anchor="middle">share of load served</text><text x="380" y="229" fill="#6b7078" text-anchor="middle">per substation and hour</text><path d="M224 85L278 85" stroke="#0b0f14" stroke-width="1.6" fill="none"/><path d="M278 85 L269 81 L269 89 Z" fill="#0b0f14"/><path d="M480 85L534 85" stroke="#0b0f14" stroke-width="1.6" fill="none"/><path d="M534 85 L525 81 L525 89 Z" fill="#0b0f14"/><path d="M636 126L636 168" stroke="#0b0f14" stroke-width="1.6" fill="none"/><path d="M636 168 L640 159 L632 159 Z" fill="#0b0f14"/><path d="M536 211L482 211" stroke="#0b0f14" stroke-width="1.6" fill="none"/><path d="M482 211 L491 215 L491 207 Z" fill="#0b0f14"/><path d="M124.0 126L124.0 150L576 150L576 168" stroke="#6b7078" stroke-width="1.3" fill="none" stroke-dasharray="4 3"/><text x="132" y="145" fill="#6b7078" >plants and load</text><line x1="24" x2="736" y1="282" y2="282" stroke="#6b7078" stroke-dasharray="2 4"/><text x="380" y="356" fill="#6b7078" text-anchor="middle" font-weight="600">outside the model, held up</text><text x="380" y="374" fill="#6b7078" text-anchor="middle" font-weight="600">against its last hour</text><rect x="24" y="322" width="250" height="82" rx="8" fill="#fff" stroke="#d9920f" stroke-width="1.4"/><text x="149" y="346" fill="#0b0f14" text-anchor="middle" font-weight="600" font-size="14">night lights</text><text x="149" y="365" fill="#6b7078" text-anchor="middle">NASA Black Marble, per</text><text x="149" y="381" fill="#6b7078" text-anchor="middle">substation area, 27–28 Sep</text><rect x="486" y="322" width="250" height="82" rx="8" fill="#fff" stroke="#d9920f" stroke-width="1.4"/><text x="611" y="346" fill="#0b0f14" text-anchor="middle" font-weight="600" font-size="14">outage reports</text><text x="611" y="365" fill="#6b7078" text-anchor="middle">U.S. DOE situation reports,</text><text x="611" y="381" fill="#6b7078" text-anchor="middle">island-wide</text><path d="M350 252L189 320" stroke="#d9920f" stroke-width="1.6" fill="none"/><path d="M189 320 L198.8 320.2 L195.7 312.8 Z" fill="#d9920f"/><path d="M410 252L571 320" stroke="#d9920f" stroke-width="1.6" fill="none"/><path d="M571 320 L564.3 312.8 L561.2 320.2 Z" fill="#d9920f"/>
