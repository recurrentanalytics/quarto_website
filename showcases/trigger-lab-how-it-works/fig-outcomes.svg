<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="The four outcomes of a trigger in one season: hit, false alarm, miss and quiet; basis risk is the false alarms and the misses" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17">
<rect width="760" height="400" rx="10" fill="#f5f5f1"/>
<text x="345" y="70" fill="#0b0f14" text-anchor="middle" font-weight="600">disaster listed</text><text x="595" y="70" fill="#0b0f14" text-anchor="middle" font-weight="600">no disaster listed</text><text x="202" y="162" fill="#0b0f14" text-anchor="end" font-weight="600">trigger pays</text><text x="202" y="292" fill="#0b0f14" text-anchor="end" font-weight="600">no payout</text><rect x="224" y="96" width="242" height="122" rx="8" fill="#4c8c57" fill-opacity="0.16" stroke="#4c8c57" stroke-width="2"/><text x="345" y="153" fill="#4c8c57" text-anchor="middle" font-weight="700" font-size="22">hit</text><text x="345" y="181" fill="#6b7078" text-anchor="middle">money when it is needed</text><rect x="474" y="96" width="242" height="122" rx="8" fill="#d9920f" fill-opacity="0.16" stroke="#d9920f" stroke-width="2"/><text x="595" y="153" fill="#d9920f" text-anchor="middle" font-weight="700" font-size="22">false alarm</text><text x="595" y="181" fill="#6b7078" text-anchor="middle">money, no disaster listed</text><rect x="224" y="226" width="242" height="122" rx="8" fill="#c2412d" fill-opacity="0.16" stroke="#c2412d" stroke-width="2"/><text x="345" y="283" fill="#c2412d" text-anchor="middle" font-weight="700" font-size="22">miss</text><text x="345" y="311" fill="#6b7078" text-anchor="middle">disaster, no money</text><rect x="474" y="226" width="242" height="122" rx="8" fill="#6b7078" fill-opacity="0.16" stroke="#6b7078" stroke-width="2"/><text x="595" y="283" fill="#6b7078" text-anchor="middle" font-weight="700" font-size="22">quiet</text><text x="595" y="311" fill="#6b7078" text-anchor="middle">neither</text><text x="380" y="378" fill="#6b7078" text-anchor="middle">basis risk lives in the two off-diagonal cells</text>
</svg>
